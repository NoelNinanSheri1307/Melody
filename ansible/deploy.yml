- hosts: localhost
  become: yes
  gather_facts: no

  vars:
    project_dir: /mnt/c/Users/VICTUS/MoodToMusicEngine

  tasks:

  # -------------------------
  # SYSTEM DEPENDENCIES (WSL)
  # -------------------------
  - name: Update package list
    apt:
      update_cache: yes

  - name: Install Node.js and npm
    apt:
      name:
        - nodejs
        - npm
      state: present

  - name: Install Python tools
    apt:
      name:
        - python3
        - python3-pip
      state: present

  # -------------------------
  # BACKEND SETUP
  # -------------------------
  - name: Install backend dependencies
    command: npm install
    args:
      chdir: "{{ project_dir }}/backend"

  - name: Create backend .env file
    copy:
      dest: "{{ project_dir }}/backend/.env"
      content: |
        PORT=5000
        MONGO_URI=mongodb://localhost:27017/mood_to_music

  # -------------------------
  # FRONTEND SETUP
  # -------------------------
  - name: Install frontend dependencies
    command: npm install
    args:
      chdir: "{{ project_dir }}/frontend"

  # -------------------------
  # ML SETUP (Windows venv)
  # -------------------------
  - name: Install ML dependencies using Windows venv
    command: >
      cmd.exe /c
      "C:\Users\VICTUS\MoodToMusicEngine\ml\venv\Scripts\pip.exe install flask deepface opencv-python numpy tensorflow==2.15.0"
    become: no
  # -------------------------
  # DEBUG / VALIDATION
  # -------------------------
  - name: Check Node version
    command: node -v
    register: node_out

  - debug:
      var: node_out.stdout

  - name: Check Python version
    command: python3 --version
    register: py_out

  - debug:
      var: py_out.stdout

